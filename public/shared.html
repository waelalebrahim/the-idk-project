<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A shared answer — The I Don't Know Project</title>
  <meta name="description" content="An answer from The I Don't Know Project — sourced, cited, and honest." />
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="The I Don't Know Project" />
  <meta property="og:title" content="A sourced answer — The I Don't Know Project" />
  <meta property="og:description" content="Answered only from real sources, with citations. From the AI that says I don't know." />
  <meta property="og:image" content="https://i-dont-know-project.pages.dev/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://i-dont-know-project.pages.dev/og-image.png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root{
      --ink:#1a2230; --paper:#edf0f3; --surface:#fff; --high:#0e7c66; --high-soft:#e2f0ec;
      --med:#c77a1a; --low:#5a6573; --line:#d4dae1; --muted:#6b7686;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;min-height:100vh;}
    .wrap{max-width:680px;margin:0 auto;padding:40px 22px 80px;}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:36px;text-decoration:none;color:var(--ink);}
    .mark{width:40px;height:40px;flex-shrink:0;}
    .brand h1{font-size:18px;font-weight:700;}
    .brand span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);display:block;}
    .q{font-size:22px;font-weight:700;margin-bottom:20px;line-height:1.3;}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
    .meter{padding:16px 20px 0;}
    .meter-track{height:6px;background:var(--paper);border-radius:3px;overflow:hidden;}
    .meter-fill{height:100%;border-radius:3px;}
    .meter-row{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:8px;text-transform:uppercase;letter-spacing:.04em;}
    .tier{font-weight:700;}
    .body{padding:18px 20px;font-size:16px;}
    .src{padding:0 20px 18px;display:flex;flex-wrap:wrap;gap:8px;}
    .chip{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--high-soft);color:var(--high);padding:6px 11px;border-radius:7px;text-decoration:none;}
    .chip i{opacity:.7;font-style:normal;}
    .cta{margin-top:32px;text-align:center;}
    .cta a{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-size:15px;font-weight:600;padding:13px 26px;border-radius:10px;}
    .cta p{color:var(--muted);font-size:13px;margin-top:12px;}
    .loading,.error{text-align:center;color:var(--muted);padding:60px 0;font-family:'IBM Plex Mono',monospace;font-size:14px;}
  </style>
</head>
<body>
  <div class="wrap">
    <a class="brand" href="/">
      <svg class="mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 3 L30 3 A7 7 0 0 1 37 10 L37 30 A7 7 0 0 1 30 37 L24 37 M16 37 L10 37 A7 7 0 0 1 3 30 L3 10 A7 7 0 0 1 10 3" fill="none" stroke="#1a2230" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
        <path d="M20 10 V22 M20 27 V30" stroke="#0e7c66" stroke-width="4" stroke-linecap="round" />
      </svg>
      <div><h1>The I Don't Know Project</h1><span>The AI that says "I don't know"</span></div>
    </a>
    <div id="content"><div class="loading">Loading…</div></div>
    <div class="cta">
      <a href="/">Ask your own question →</a>
      <p>Answers only from real sources, with citations. Open-source.</p>
    </div>
  </div>

  <script>
    const TIER = {
      high:   { label: "High confidence", color: "#0e7c66", fill: "92%" },
      medium: { label: "Medium — verify",  color: "#c77a1a", fill: "55%" },
      low:    { label: "Not in sources",   color: "#5a6573", fill: "16%" },
    };
    function esc(x){ const d=document.createElement("div"); d.textContent=x==null?"":String(x); return d.innerHTML; }
    function getId(){ const p=new URLSearchParams(location.search); return (p.get("id")||"").trim(); }

    async function load(){
      const id = getId();
      const el = document.getElementById("content");
      if(!id){ el.innerHTML = '<div class="error">No answer specified.</div>'; return; }
      try{
        const r = await fetch("/api/share/get?id=" + encodeURIComponent(id));
        const d = await r.json();
        if(!d.ok || !d.answer){ el.innerHTML = '<div class="error">This shared answer was not found.</div>'; return; }
        const a = d.answer;
        const t = TIER[a.confidence] || TIER.low;
        const chips = (a.chips||[]).map(c => c.url
          ? '<a class="chip" href="'+esc(c.url)+'" target="_blank" rel="noreferrer">'+esc(c.title)+' <i>· '+esc(c.date)+'</i></a>'
          : '<span class="chip">'+esc(c.title)+' <i>· '+esc(c.date)+'</i></span>'
        ).join("");
        el.innerHTML =
          (a.question ? '<div class="q">'+esc(a.question)+'</div>' : '') +
          '<div class="card">' +
            '<div class="meter"><div class="meter-track"><div class="meter-fill" style="width:'+t.fill+';background:'+t.color+'"></div></div>' +
            '<div class="meter-row"><span>Known</span><span class="tier" style="color:'+t.color+'">'+t.label+'</span><span>Unknown</span></div></div>' +
            '<div class="body">'+esc(a.answer)+'</div>' +
            (chips ? '<div class="src">'+chips+'</div>' : '') +
          '</div>';
      }catch(e){
        el.innerHTML = '<div class="error">Could not load this answer.</div>';
      }
    }
    load();
  </script>
</body>
</html>
